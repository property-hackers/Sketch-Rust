[workspace]
resolver = "2"
members = ["crates/sketch-core", "crates/sketch-app"]

[workspace.package]
version = "0.1.29"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
